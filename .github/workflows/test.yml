name: Tests

on:
  push:              # runs on every commit to every branch
  pull_request:
    branches: [main] # required check before merging to main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: "test-openai-key-not-real"
      CARTESIA_API_KEY: "test-cartesia-key-not-real"
      CARTESIA_VOICE_ID: "test-cartesia-voice-id"
      USER_NAME: "TestUser"
      LOG_LEVEL: "INFO"
      STT_MODEL: "whisper-1"
      LLM_MODEL: "gpt-4o"
      LANGFUSE_PUBLIC_KEY: "test-langfuse-pk"
      LANGFUSE_SECRET_KEY: "test-langfuse-sk"
      LANGFUSE_BASE_URL: "https://cloud.langfuse.com"
      ATLAS_LLM_MODEL: "gpt-4o-mini"
      ATLAS_WORKSPACE: "/tmp/test-atlas-workspace"
      ATLAS_VOICE_ID: "test-atlas-voice-id"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ hashFiles('poetry.lock') }}
          restore-keys: poetry-

      - name: Install system audio deps
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - name: Install dependencies
        run: poetry install --with dev

      - name: Lint
        run: poetry run ruff check .

      - name: Run tests
        run: poetry run pytest -v --tb=short
