[tool.poetry]
name = "hope"
version = "0.1.0"
description = "HOPE — personal AI voice agent"
authors = ["Pavan Mutyala <mutyalapavan9@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pipecat-ai = {version = "1.3.0", extras = ["openai", "cartesia", "silero"]}
pyaudio = "0.2.14"
python-dotenv = "1.2.2"
rich = "15.0.0"
pydantic-settings = "2.14.1"

[tool.poetry.group.dev.dependencies]
pytest = "9.0.3"
pytest-asyncio = "1.4.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
