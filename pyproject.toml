[tool.poetry]
name = "hope"
version = "0.1.0"
description = "HOPE — personal AI voice agent"
authors = ["Pavan Mutyala <mutyalapavan9@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pipecat-ai = {extras = ["openai", "cartesia", "kokoro", "silero"], version = "^1.4.0"}
pyaudio = "0.2.14"
python-dotenv = "1.2.2"
rich = "15.0.0"
pydantic-settings = "2.14.1"
langfuse = "^4.7.1"
aiofiles = "^25.1.0"
send2trash = "^2.1.0"
litellm = "^1.92.0"
chromadb = "^1.5.0"
python-ulid = "^3.1.0"
mem0ai = "^2.0.14"
pyyaml = "^6.0"
reflex = "^0.9.8"
httpx = "^0.28.1"
trafilatura = "^2.0"

[tool.poetry.group.dev.dependencies]
pytest = "9.0.3"
pytest-asyncio = "1.4.0"
ruff = "^0.9.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Pure logic tests, no external dependencies",
    "integration: Pipeline assembly and wiring tests with mocks",
    "contract: Interface compliance tests for swappable components",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
